// ============================================================
// BUKHORIY — PORTABLE CS2 CONFIG
// Built from your uploaded CS2 settings
// Usage: put this file in ...\Counter-Strike Global Offensive\game\csgo\cfg
// Then open CS2 console and run: exec bukhoriy
// ============================================================

// ---------- MOUSE ----------
sensitivity "0.9"
zoom_sensitivity_ratio "1"
m_pitch "0.022"
m_yaw "0.022"

// ---------- CROSSHAIR ----------
cl_crosshairstyle "4"
cl_crosshairsize "0.5"
cl_crosshairthickness "1.5"
cl_crosshairgap "-4"
cl_crosshairdot "0"
cl_crosshair_drawoutline "0"
cl_crosshair_outlinethickness "0"
cl_crosshair_t "0"
cl_crosshair_recoil "0"
cl_crosshairusealpha "1"
cl_crosshairalpha "255"
cl_crosshaircolor "5"
cl_crosshaircolor_r "0"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "0"
cl_crosshairgap_useweaponvalue "0"
cl_fixedcrosshairgap "3"
cl_crosshair_sniper_width "1"
cl_crosshair_friendly_warning "1"

// Grenade crosshair
cl_grenadecrosshair_decoy "1"
cl_grenadecrosshair_explosive "1"
cl_grenadecrosshair_fire "1"
cl_grenadecrosshair_flash "1"
cl_grenadecrosshair_smoke "1"
cl_grenadecrosshair_keepusercrosshair "1"
cl_grenadecrosshairdelay_decoy "2"
cl_grenadecrosshairdelay_explosive "2"
cl_grenadecrosshairdelay_fire "2"
cl_grenadecrosshairdelay_flash "2"
cl_grenadecrosshairdelay_smoke "2"

// ---------- VIEWMODEL ----------
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "2"
viewmodel_offset_z "-2"
cl_prefer_lefthanded "0"

// ---------- MOVEMENT / CORE BINDS ----------
bind "w" "+forward"
bind "a" "+left"
bind "s" "+back"
bind "d" "+right"
bind "shift" "+sprint"
bind "ctrl" "+duck"
bind "space" "+jump"
bind "mwheelup" "+jump"
bind "mwheeldown" "+jump"
bind "mouse1" "+attack"
bind "mouse3" "+voicerecord"
bind "`" "toggleconsole"

// Mouse5 duck bind
alias "+jb" "+duck"
alias "-jb" "-duck"
bind "mouse5" "+jb"

// ALT crouch-jump
alias "+cjump" "+jump;+duck"
alias "-cjump" "-jump;-duck"
bind "alt" "+cjump"

// Practice grenade rethrow binds
bind "i" "sv_rethrow_last_grenade"
bind "k" "sv_rethrow_last_grenade"

// ---------- RADAR ----------
cl_radar_always_centered "0"
cl_radar_icon_scale_min "0.6"
cl_radar_rotate "1"
cl_radar_scale "0.547576"
cl_radar_scale_dynamic "0"
cl_radar_square_always "0"
cl_radar_square_when_spectating "1"
cl_radar_square_with_scoreboard "1"
cl_hud_radar_scale "1.12675"
cl_hud_radar_background_alpha "0.396768"
cl_hud_radar_blur_background "1"
cl_hud_radar_map_additive "1"

// ---------- HUD / TELEMETRY ----------
cl_hud_color "9"
hud_scaling "0.903726"
hud_showtargetid "1"
cl_showloadout "1"
cl_teamcounter_playercount_instead_of_avatars "0"
cl_teammate_colors_show "1"
cl_teamid_overhead_mode "3"
cl_teamid_overhead_colors_show "1"
cl_teamid_overhead_fade_near_crosshair "0.5"
cl_hud_telemetry_frametime_show "1"
cl_hud_telemetry_frametime_poor "100"
cl_hud_telemetry_net_misdelivery_show "1"
cl_hud_telemetry_net_misdelivery_poor "2"
cl_hud_telemetry_ping_show "1"
cl_hud_telemetry_ping_poor "100"
safezonex "1"
safezoney "0.8"

// ---------- GAMEPLAY / VISUAL ----------
con_enable "1"
crosshair "1"
cl_debounce_zoom "1"
option_duck_method "0"
option_speed_method "0"
voice_vox "0"
cl_buywheel_donate_key "0"
cl_buywheel_nonumberpurchasing "0"
cl_inventory_radial_immediate_select "1"
cl_inventory_radial_tap_to_cycle "1"
cl_ironsight_dot_scale "1"
cl_ironsight_usecrosshaircolor "1"
cl_autohelp "1"
cl_dm_buyrandomweapons "0"
cl_use_opens_buy_menu "0"
cl_sniper_auto_rezoom "1"
cl_sniper_delay_unscope "0"
cl_sniper_show_inaccuracy "1"
cl_silencer_mode "0"
cl_weapon_selection_rarity_color "1"
r_drawtracers_firstperson "1"
r_player_visibility_mode "1"
r_fullscreen_gamma "2.7"

// ---------- NETWORK / FPS ----------
rate "786432"
cl_net_buffer_ticks "1"
mm_dedicated_search_maxping "150"
fps_max "0"
fps_max_ui "0"

// NOTE: cl_interp_ratio from the old config was intentionally omitted.
// Current CS2 uses its newer networking/subtick model and old CS:GO interp tweaks
// should not be blindly forced.

// ---------- AUDIO ----------
volume "1"
snd_gamevolume "1"
snd_gamevoicevolume "1"
snd_voipvolume "1"
snd_headphone_eq "0"
snd_mute_losefocus "1"
snd_menumusic_volume "0.04"
snd_mvp_volume "0"
snd_roundstart_volume "0"
snd_roundaction_volume "0"
snd_roundend_volume "0"
snd_mapobjective_volume "0.038207"
snd_tensecondwarning_volume "0.04"
snd_deathcamera_volume "0"

// ---------- MISC ----------
cl_color "2"
cl_hide_avatar_images "0"
cl_mute_all_but_friends_and_party "0"
cl_mute_enemy_team "0"
cl_player_ping_mute "0"
cl_show_observer_crosshair "2"
cl_observed_bot_crosshair "2"
cl_show_clan_in_death_notice "1"
cl_show_equipped_character_for_player_avatars "0"

// Confirmation in console
echo "========================================"
echo "  BUKHORIY PORTABLE CONFIG LOADED"
echo "  sens 0.9 | viewmodel 68 | green crosshair"
echo "========================================"
